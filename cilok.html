<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D(ish) Product showcase</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-image: url('https://nasuka.pro/gambar/langit.gif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.p_slider {
  width: 230px;
  height: 389.85px;
  position: relative;
}
.p_slider__item {
  position: absolute;
  width: 230px;
  height: 230px;
  cursor: pointer;
  transition-duration: 0.5s;
  transition-property: transform, left, opacity;
}
.p_slider__item img {
  width: 230px;
  position: relative;
  animation: scale_bounce 2s infinite ease-in-out;
  -webkit-box-reflect: below 4px linear-gradient(transparent, transparent 50%, rgba(255, 255, 255, 0.2));
}
.p_slider__item:nth-of-type(1) { transform: scale(0.6); left: -230px; filter: blur(2px); opacity: 0.8; z-index: 1; }
.p_slider__item:nth-of-type(2) { transform: scale(1); left: 0px; z-index: 2; }
.p_slider__item:nth-of-type(3) { transform: scale(0.6); left: 230px; z-index: 1; filter: blur(2px); opacity: 0.8; }
.controls {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  box-sizing: border-box;
  pointer-events: none;
}
.controls > div {
  cursor: pointer;
  padding: 20px;
  pointer-events: auto;
}
.controls .left img { transform: rotate(180deg); opacity: 0.5; }
.controls .right img { opacity: 0.5; }
@keyframes scale_bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
</style>
</head>
<body>
<div class='p_slider'>
  <div class='p_slider__item' onclick="window.location.href='file1.html'"><img src='https://nasuka.pro/gambar/qris.jpg'></div>
  <div class='p_slider__item' onclick="window.location.href='file2.html'"><img src='https://nasuka.pro/gambar/qris.jpg'></div>
  <div class='p_slider__item' onclick="window.location.href='file3.html'"><img src='https://nasuka.pro/gambar/qris.jpg'></div>
</div>
<div class='controls'>
  <div class='left' onclick="move('right')"><img src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/arrow.png'></div>
  <div class='right' onclick="move('left')"><img src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/arrow.png'></div>
</div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script>
var on = 0, pos = 1, pos2 = 2, pos3 = 3;
function move(dir) {
  if(on == 1) return;
  on = 1;
  if(dir == 'left') {
    $('.p_slider__item:nth-of-type(' + pos + ')').animate({'left':'230px'}, 300).css('z-index', 0);
    $('.p_slider__item:nth-of-type(' + pos2 + ')').animate({'left':'-230px'}, 300);
    $('.p_slider__item:nth-of-type(' + pos3 + ')').animate({'left':'0px'}, 300).css({'transform':'scale(1)','filter':'blur(0px)','z-index': 2});
    setTimeout(function(){
      $('.p_slider__item:nth-of-type(' + pos2 + ')').css({'transform':'scale(0.6)','filter':'blur(2px)','z-index': 1});
      pos = (pos % 3) + 1; pos2 = (pos2 % 3) + 1; pos3 = (pos3 % 3) + 1;
      on = 0;
    }, 300);
  } else {
    $('.p_slider__item:nth-of-type(' + pos3 + ')').animate({'left':'-230px'}, 300).css('z-index', 0);
    $('.p_slider__item:nth-of-type(' + pos2 + ')').animate({'left':'230px'}, 300);
    $('.p_slider__item:nth-of-type(' + pos + ')').animate({'left':'0px'}, 300).css({'transform':'scale(1)','filter':'blur(0px)','z-index': 2});
    setTimeout(function(){
      $('.p_slider__item:nth-of-type(' + pos2 + ')').css({'transform':'scale(0.6)','filter':'blur(2px)','z-index': 1});
      pos = pos - 1 < 1 ? 3 : pos - 1; pos2 = pos2 - 1 < 1 ? 3 : pos2 - 1; pos3 = pos3 - 1 < 1 ? 3 : pos3 - 1;
      on = 0;
    }, 300);
  }
}
setInterval(function(){ move('left'); }, 4000);
</script>
</body>
</html>
