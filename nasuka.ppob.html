    function tutupCustomAlert() { document.getElementById('customAlert').style.display = 'none'; }
    function resetSelectedProduct() { selectedProductValue = ""; selectedProductHarga = 0; selectedProductQty = 0; selectedProductName = ""; document.querySelectorAll('.product-item').forEach(el => el.classList.remove('selected')); }
    function batasiInputAngka(elementId, maxLength) { const inputEl = document.getElementById(elementId); if(inputEl) { inputEl.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); if (this.value.length > maxLength) this.value = this.value.slice(0, maxLength); }); } }

    function handleMenuAuth(type) {
        if (!localStorage.getItem('userPhone')) {
            showLogin();
        } else {
            if (type === 'profil') {
                window.location.href = 'https://nasuka.pro/profil.html';
            } else if (type === 'riwayat') {
                window.location.href = 'https://nasuka.pro/riwayat.html';
            }
        }
    }

    function bukaPriceModal(val, hargaAsli, hargaJual) {
        event.stopPropagation();
        const modal = document.getElementById('priceModal');
        const inputPrice = document.getElementById('inputNewPrice');
        const btnSave = document.getElementById('btnSavePrice');
        inputPrice.value = hargaJual;
        modal.style.display = 'flex';
        btnSave.onclick = function() {
            const newPrice = parseInt(inputPrice.value);
            const phone = localStorage.getItem('userPhone');
            const markup = newPrice - hargaAsli;
            db.ref(`users/${phone}/markup_custom/${val}`).set(markup).then(() => {
                tutupPriceModal();
                renderProdukDinamis(currentActiveType);
            });
        };
    }

    function tutupPriceModal() { document.getElementById('priceModal').style.display = 'none'; }

    function formatStrukStatus(data) {
        const now = new Date().toLocaleString('id-ID');
        const snLine = (data.sn) ? `<div style="margin-top:10px;">SN/VOUCHER:</div><div class="sn-box">${data.sn}</div>` : '';
        return `<div class="struk-content"><div style="text-align:center; font-weight:bold; border-bottom: 1px dashed #000; padding-bottom:5px;"><br>STATUS: ${data.status.toUpperCase()}</div><div style="margin: 10px 0; font-size: 13px;"><div class="struk-row"><span>Waktu:</span> <span>${now}</span></div><div class="struk-row"><span>ID Order:</span> <span>${data.refID || '-'}</span></div><div class="struk-row"><span>Tujuan:</span> <span>${data.dest || '-'}</span></div><div class="struk-row"><span>Produk:</span> <span>${data.product || '-'}</span></div><div class="struk-row"><span>Harga:</span> <span>Rp ${data.price ? data.price.toLocaleString('id-ID') : '0'}</span></div></div>${snLine}<div style="border-top: 1px dashed #000; padding-top:5px; text-align:center; font-size: 12px;">Terima Kasih atas Kepercayaan Anda</div></div>`;
    }

    function formatApiResponse(res) {
        if (res.success || res.status) {
            const d = res.data || {};
            const now = new Date().toLocaleString('id-ID');
            return `<div class="struk-container"><div class="struk-header">NASUKA WIRELESS<br></div><div class="struk-body"><div><span>Waktu:</span> <span>${now}</span></div><div><span>ID Order:</span> <span>${d.order_number || '-'}</span></div><div><span>Tujuan:</span> <span>${document.getElementById('input-nomor-tujuan').value || document.getElementById('meter_id').value}</span></div><div><span>Produk:</span> <span>${selectedProductName || 'Reguler'}</span></div><div style="font-size: 16px; margin-top:10px;"><span>TOTAL:</span> <span>Rp ${selectedProductHarga.toLocaleString('id-ID')}</span></div></div><div class="struk-footer">TERIMA KASIH</div></div>`;
        } else {
            return `<div style="text-align:center; color: red;"><strong>TRANSAKSI GAGAL</strong><br>${res.message || 'Terjadi kesalahan sistem'}</div>`;
        }
    }
    
    function detectOperator() {
        const no = document.getElementById('input-nomor-tujuan').value;
        const currentPanel = document.getElementById('panel-' + currentActiveType);
        const filterInput = document.getElementById('input-filter-durasi').value.toLowerCase().replace(/\s/g, '');
        
        if (!currentPanel) return;
        const items = currentPanel.querySelectorAll('.product-item');
        if (['pulsa', 'paket', 'masaaktif'].indexOf(currentActiveType) === -1) {
            items.forEach(item => item.style.display = 'flex');
            return;
        }

        const prefix = no.substring(0, 4);
        let operator = "";
        if (['0811', '0812', '0813', '0821', '0822', '0852', '0853', '0823'].includes(prefix)) operator = "TSEL";
        else if (['0814', '0815', '0816', '0855', '0856', '0857', '0858'].includes(prefix)) operator = "ISAT";
        else if (['0831', '0859', '0832', '0833', '0838'].includes(prefix)) operator = "AXIS";
        else if (['0817', '0818', '0819', '0877', '0878'].includes(prefix)) operator = "XL";
        else if (['0895', '0896', '0897', '0898', '0899'].includes(prefix)) operator = "TRI";
        else if (['0881', '0882', '0883', '0884', '0885', '0886', '0887', '0888', '0889'].includes(prefix)) operator = "FREN";
        
        items.forEach(item => {
            const itemOp = item.getAttribute('data-op');
            const itemNama = item.querySelector('.product-name').innerText.toLowerCase().replace(/\s/g, '');
            const matchOp = (operator === "" || itemOp === operator);
            const matchFilter = (filterInput === "" || itemNama.includes(filterInput));
            
            item.style.display = (matchOp && matchFilter) ? 'flex' : 'none';
        });
    }
    
    function toggleDetail(event, id) {
        event.stopPropagation();
        const el = document.getElementById(id);
        const btn = event.target;
        if (el.style.display === 'block') {
            el.style.display = 'none';
            btn.innerText = 'Detail';
        } else {
            el.style.display = 'block';
            btn.innerText = 'Tutup';
        }
    }

   
       async function renderProdukDinamis(type) {
        const phone = localStorage.getItem('userPhone');
        let customMarkups = {};
        if (phone) {
            const snap = await db.ref(`users/${phone}/markup_custom`).once('value');
            customMarkups = snap.val() || {};
        }

        const filterInput = document.getElementById('input-filter-durasi');
        if (['paket', 'masaaktif'].includes(type)) {
            filterInput.disabled = false;
        } else {
            filterInput.disabled = true;
            filterInput.value = '';
        }

        const walletTypes = ['dana', 'ovo', 'gopay', 'shopeepay', 'isaku', 'doku', 'linkaja', 'kaspro'];
        const isEwallet = walletTypes.includes(type);

        const inputVal = (type === 'pln') ? (document.getElementById('meter_id').value || "Belum diisi") : document.getElementById('input-nomor-tujuan').value;
             
        let gridId = 'grid' + type.charAt(0).toUpperCase() + type.slice(1);
        let grid = document.getElementById(gridId);
        
        let path = `produk_agregator/${type}`;
        db.ref(path).once('value', snapshot => {
            if (!grid) return;
            let items = [];
            snapshot.forEach(child => {
                if (child.val().harga) {
                    if (isEwallet || String(child.val().status) === "1") {
                        items.push(child.val());
                    }
                } else {
                    child.forEach(subChild => {
                        if (isEwallet || String(subChild.val().status) === "1") {
                            items.push(subChild.val());
                        }
                    });
                }
            });
            items.sort((a, b) => (a.harga || 0) - (b.harga || 0));
            grid.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'product-item';
                if (item.op) div.setAttribute('data-op', item.op);
                
                const hargaAsli = parseInt(item.harga);
                const markup = customMarkups[item.val] || 0;
                const hargaJual = parseInt(item.harga_jual || item.harga) + markup;
                
                const labelMarkup = markup >= 0 ? "Keuntungan" : "Kerugian";
                const warnaMarkup = markup >= 0 ? "#059669" : "#dc2626";
                const detailId = 'detail-' + Math.random().toString(36).substr(2, 9);
                
                div.onclick = function() { 
                    pilihProdukGlow(this, item.val, hargaAsli, item.qty || 0, item.nama || item.label); 
                };
                
                let baris1Teks = "-";
                let baris2Teks = "-";
                let htmlBerlaku = "";
                
                if (isEwallet) {
                    const nominalRaw = (item.nama || item.label).replace(/[^0-9]/g, '');
                    const nominal = parseInt(nominalRaw) || 0;
                    baris1Teks = `Transfer: Rp ${nominal.toLocaleString('id-ID')}`;
                    baris2Teks = `Tujuan: ${inputVal || '-'}`;
                } else if (type === 'pln') {
                    baris1Teks = `⚡ Produk: ${item.nama || item.label}`;
                    baris2Teks = `ID Pelanggan : ${inputVal}`;
                } else if (type === 'masaaktif') {
                    baris1Teks = `📅 Perpanjang: ${item.nama || item.label}`;
                    baris2Teks = `Tujuan: ${inputVal || '-'}`;
                } else {
                    const namaProduk = (item.nama || "").toLowerCase();
                    if (namaProduk.includes("gb")) {
                        const match = namaProduk.match(/(\d+\s*gb)/);
                        baris1Teks = `🌐 Kuota: ${match ? match[1].toUpperCase() : "Data"}`;
                    } else if (namaProduk.includes("unlimited")) {
                        baris1Teks = `🌐 Kuota: Unlimited`;
                    } else {
                        baris1Teks = `📱 Pulsa Reguler: ${item.nama || item.label}`;
                    }
                    if (namaProduk.includes("jam")) {
                        baris2Teks = `⏰ Masa Aktif: ${namaProduk.match(/(\d+\s*jam)/) ? namaProduk.match(/(\d+\s*jam)/)[0] : "1 Jam"}`;
                    } else if (namaProduk.includes("hari")) {
                        baris2Teks = `⏰ Masa Aktif: ${namaProduk.match(/(\d+\s*hari)/) ? namaProduk.match(/(\d+\s*hari)/)[0] : "1 Hari"}`;
                    } else if (namaProduk.includes("bulan")) {
                        baris2Teks = `⏰ Masa Aktif: ${namaProduk.match(/(\d+\s*bulan)/) ? namaProduk.match(/(\d+\s*bulan)/)[0] : "30 Hari"}`;
                    }
                    htmlBerlaku = `<div class="detail-row">🇮🇩 Berlaku : Nasional</div>`;
                }
                
                div.innerHTML = `
                    <div class="product-header">
                        <div class="product-name">${item.nama || item.label}</div>
                        <div class="harga-wrapper">
                            <span class="product-price" onclick="bukaPriceModal('${item.val}', ${hargaAsli}, ${hargaJual});">
                                Rp ${hargaJual.toLocaleString('id-ID')} ✍️
                            </span>
                            <button class="toggle-harga-btn" onclick="toggleDetail(event, '${detailId}')">Detail</button>
                            <div id="${detailId}" class="hidden-details" style="display:none; margin-top:5px;">
                                <span style="font-size: 11px; color: #666; display:block;">Harga Modal: Rp ${hargaAsli.toLocaleString('id-ID')}</span>
                                <span style="font-size: 11px; color: ${warnaMarkup}; font-weight: bold; display:block;">${labelMarkup}: Rp ${Math.abs(markup).toLocaleString('id-ID')}</span>
                                <span style="font-size: 9px; color: #475569; display:block; margin-top:4px; font-style: italic;">Saldo yang terpotong adalah saldo senilai harga modal, ${labelMarkup.toLowerCase()} adalah uang yang anda hasilkan dari penjualan ke customers</span>
                            </div>
                        </div>
                    </div>
                    <div class="product-details">
                        <div class="detail-row">${baris1Teks}</div>
                        <div class="detail-row">${baris2Teks}</div>
                        ${htmlBerlaku}
                    </div>
                `;
                grid.appendChild(div);
            });
            detectOperator();
        });
    }

   
   
        
    function switchTab(type) {
        currentActiveType = type;
        resetSelectedProduct();
        const panels = ['panel-pln', 'panel-pulsa', 'panel-paket', 'panel-dana', 'panel-ovo', 'panel-gopay', 'panel-shopeepay', 'panel-isaku', 'panel-doku', 'panel-linkaja', 'panel-kaspro', 'panel-masaaktif'];
        panels.forEach(id => document.getElementById(id).style.display = (id === 'panel-' + type) ? 'block' : 'none');
        
        const grids = ['gridPulsa', 'gridPaket', 'gridPln', 'gridDana', 'gridOvo', 'gridGopay', 'gridShopeepay', 'gridIsaku', 'gridDoku', 'gridLinkaja', 'gridKaspro', 'gridMasaaktif'];
        grids.forEach(id => { const g = document.getElementById(id); if(g) g.innerHTML = ''; });
        
        const results = ['resultPulsa', 'resultPaket', 'resultPLN', 'resultDana', 'resultOvo', 'resultGopay', 'resultShopeepay', 'resultIsaku', 'resultDoku', 'resultLinkaja', 'resultKaspro', 'resultMasaaktif'];
        results.forEach(id => { const r = document.getElementById(id); if(r) r.innerHTML = ''; });

        const inputTop = document.getElementById('input-top-container');
        const inputPln = document.getElementById('input-pln-container');
        const footerOrder = document.getElementById('footer-order');
        footerOrder.style.display = 'block';
        
        if (type === 'pln') { 
            inputTop.style.display = 'none'; 
            inputPln.style.display = 'block'; 
            renderProdukDinamis('pln');
        } else { 
            inputTop.style.display = 'block'; 
            inputPln.style.display = 'none'; 
            renderProdukDinamis(type);
        }
    }    
    
    function pilihKategori(kategori) {
        const semuaKategori = document.querySelectorAll('.card-kategori');
        semuaKategori.forEach(el => el.classList.remove('active-kategori'));
        event.currentTarget.classList.add('active-kategori');
        const mapping = { 'Pulsa': 'pulsa', 'Paket Data': 'paket', 'Dana': 'dana', 'Ovo': 'ovo', 'Gopay': 'gopay', 'Shopeepay': 'shopeepay', 'Isaku': 'isaku', 'Doku': 'doku', 'Linkaja': 'linkaja', 'Kaspro': 'kaspro', 'Token Listrik': 'pln', 'Masa Aktif': 'masaaktif' };
        if(!mapping[kategori]) return;
        switchTab(mapping[kategori]);
        const radioMap = { 'Paket Data': 'item4', 'Pulsa': 'item2', 'Token Listrik': 'item1',  'Dana': 'item12', 'Ovo': 'item5', 'Gopay': 'item6', 'Shopeepay': 'item7', 'Isaku': 'item8', 'Doku': 'item9', 'Linkaja': 'item10', 'Kaspro': 'item11', 'Masa Aktif': 'item3' };
        if(radioMap[kategori]) document.getElementById(radioMap[kategori]).checked = true;
    }

    function pilihProdukGlow(element, value, harga, qty, name) {
        const items = document.querySelectorAll('#panel-' + currentActiveType + ' .product-item');
        items.forEach(el => el.classList.remove('selected'));   
        element.classList.add('selected');   
        selectedProductValue = value;
        selectedProductHarga = harga;
        selectedProductQty = qty;
        selectedProductName = name;
    }

    function tampilkanModal(htmlContent) { const modal = document.getElementById('apiModal'); document.getElementById('modalBody').innerHTML = htmlContent; modal.style.display = 'flex'; }
    function tutupModal() { document.getElementById('apiModal').style.display = 'none'; }
    function showLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
    function hideLogin() { document.getElementById('loginOverlay').style.display = 'none'; }
    
    function prosesLogin() {
        const phone = document.getElementById('loginPhone').value.trim();
        const pin = document.getElementById('loginPin').value.trim();
        if (!phone || !pin) return showAlert('Data wajib diisi!');
        db.ref('users/' + phone).once('value', snap => {
            if (snap.exists()) {
                if (String(snap.val().pin) === String(pin)) { localStorage.setItem('userPhone', phone); hideLogin(); initUserSession(phone); } else { showAlert('PIN salah!'); }
            } else {
                db.ref('settings/userCounter').transaction(current => { return (current || 0) + 1; }, (error, committed, snapshot) => {
                    if (error) { showAlert('Gagal membuat akun: ' + error.message); } else if (committed) {
                        const newId = snapshot.val();
                        db.ref('users/' + phone).set({ pin: pin, saldo: 0, kodeUnik: newId, created_at: new Date().toISOString() }).then(() => { localStorage.setItem('userPhone', phone); hideLogin(); initUserSession(phone); });
                    }
                });
            }
        });
    }

    function initUserSession(ph) {
        if (ph) {
            db.ref('users/' + ph + '/saldo').on('value', snap => { userSaldo = snap.val() || 0; document.getElementById('display-saldo').innerText = "Rp " + userSaldo.toLocaleString('id-ID'); });
            initGlobalStatusListener();
        }
    }

    function initGlobalStatusListener() {
        const userPhone = localStorage.getItem('userPhone');
        if (!userPhone) return;
        db.ref(`users/${userPhone}/riwayat`).on('child_changed', (snapshot) => { const data = snapshot.val(); if (data.status === 'success' || data.status === 'failed') tampilkanModal(formatStrukStatus(data)); });
    }

    async function postOrder(urlData) {
        const btn = document.getElementById('btn-beli-dinamis'); 
        const loader = document.getElementById('globalLoader');
        btn.disabled = true; 
        loader.style.display = 'block';
        try {
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(urlData) });
            const result = await response.json();
            if(result.status === true || result.success === true) { 
                await db.ref(`users/${localStorage.getItem('userPhone')}/riwayat/${urlData.refID}`).set({ refID: urlData.refID, product: urlData.product, dest: urlData.dest, status: 'ordered', price: urlData.price, timestamp: new Date().toISOString() }); 
                tampilkanModal(formatApiResponse(result));
            } else {
                if (result.message && (result.message.toLowerCase().includes("digit") || result.message.toLowerCase().includes("validasi") || result.message.toLowerCase().includes("gagal"))) {
                    showAlert('Nomor ID salah');
                } else {
                    tampilkanModal(`<div style="text-align:center; color: red;"><strong>TRANSAKSI GAGAL</strong><br>${result.message || 'Terjadi kesalahan sistem'}</div>`);
                }
            }
        } catch (err) { showAlert('Terjadi kesalahan.'); } finally { btn.disabled = false; loader.style.display = 'none'; }
    }

    function eksekusiBeli() {
        const ph = localStorage.getItem('userPhone'); if (!ph) return showLogin();
        const dest = (currentActiveType === 'pln') ? document.getElementById('order_meter_id').value : document.getElementById('input-nomor-tujuan').value;
        if(!dest || !selectedProductValue) return showAlert("Prosedur Belum Lengkap!");
        if (userSaldo < selectedProductHarga) return showAlert("Saldo Tidak Mencukupi!");
        const finalProductCode = selectedProductValue.toString().trim();
        const refID = currentActiveType.toUpperCase() + Date.now();
        const common = { refID: refID, userPhone: ph, price: selectedProductHarga, product: selectedProductName, dest: dest };
        postOrder({ ...common, action: 'order' + currentActiveType.charAt(0).toUpperCase() + currentActiveType.slice(1), product: finalProductCode });
    }

    document.getElementById('btnCheck').onclick = async () => {
        const m = document.getElementById('meter_id').value;
        const loader = document.getElementById('loadingImage');
        const infoDiv = document.getElementById('info-pelanggan');
        if (!m) return showAlert("Masukkan ID!");
        loader.style.display = 'block';
        infoDiv.style.display = 'none';
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'checkPLN', meter_id: m }) });
            const data = await res.json();
            loader.style.display = 'none';
            if(data.success) { 
                infoDiv.innerHTML = `<strong>Nama:</strong> ${data.data.name}<br><strong>Daya:</strong> ${data.data.power_formatted}`;
                infoDiv.style.display = 'block';
                document.getElementById('order_meter_id').value = data.data.meter_id; 
                renderProdukDinamis('pln'); 
            } else { 
                if (data.message && (data.message.toLowerCase().includes("digit") || data.message.toLowerCase().includes("validasi") || data.message.toLowerCase().includes("gagal"))) {
                    showAlert('Nomor ID salah');
                } else {
                    tampilkanModal(`<strong>Error:</strong> ${data.message || 'Cek ID Gagal'}`); 
                }
            }
        } catch (err) { loader.style.display = 'none'; showAlert("Gagal melakukan pengecekan."); }
    };
    
    window.onload = () => {
        const savedPh = localStorage.getItem('userPhone');
        if (savedPh) initUserSession(savedPh);
        document.getElementById('input-nomor-tujuan').addEventListener('input', () => { detectOperator(); renderProdukDinamis(currentActiveType); });
        document.getElementById('input-filter-durasi').addEventListener('input', () => { detectOperator(); });
        document.getElementById('meter_id').addEventListener('input', () => { 
            if(document.getElementById('meter_id').value.length < 5) {
                document.getElementById('gridPln').innerHTML = '';
                document.getElementById('info-pelanggan').style.display = 'none';
            }
        });
    
        switchTab('pln');
        batasiInputAngka('loginPhone', 13); batasiInputAngka('loginPin', 4); batasiInputAngka('meter_id', 20); batasiInputAngka('input-nomor-tujuan', 15);
    };
    
    
    
    
        function toggleAuthPanel() {
        if (!localStorage.getItem('userPhone')) {
            showLogin();
        } else {
            const btnLogout = document.getElementById('btn-logout');
            btnLogout.style.display = (btnLogout.style.display === 'none') ? 'block' : 'none';
        }
    }

    function prosesLogout() {
        localStorage.clear();
        document.getElementById('display-saldo').innerText = "Rp --";
        document.getElementById('btn-logout').style.display = 'none';
        window.location.reload();
    }

    function initUserSession(ph) {
        if (ph) {
            db.ref('users/' + ph + '/saldo').on('value', snap => { 
                userSaldo = snap.val() || 0; 
                document.getElementById('display-saldo').innerText = "Rp " + userSaldo.toLocaleString('id-ID'); 
            });
            initGlobalStatusListener();
            document.getElementById('btn-logout').style.display = 'none'; // Pastikan awal tersembunyi
        }
    }

    function hideLogin() { 
        document.getElementById('loginOverlay').style.display = 'none'; 
        document.getElementById('btn-logout').style.display = 'none';
    }

    
    
    
</script>
