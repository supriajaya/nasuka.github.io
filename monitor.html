<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <script>
        const firebaseConfig = {
            databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function prosesSaldo() {
            const pendingRef = db.ref('pending_topup');
            pendingRef.once('value', (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const key = childSnapshot.key;
                    const data = childSnapshot.val();
                    const uid = data.user_id;
                    const nominal = parseInt(data.nominal_asli);

                    const userSaldoRef = db.ref('users/' + uid + '/saldo');
                    userSaldoRef.transaction((currentSaldo) => {
                        return (currentSaldo || 0) + nominal;
                    }).then(() => {
                        db.ref('pending_topup/' + key).remove();
                    });
                });
            });
        }
        
        // Panggil fungsi saat halaman selesai dimuat
        window.onload = prosesSaldo;
    </script>
</body>
</html>
