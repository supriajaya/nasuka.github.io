<!DOCTYPE html>
<html>
<body>
    <div id="status">Sistem Pemroses Saldo Aktif...</div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('logs').limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            if (!data || !data.notif) return;
            
            const isiNotif = data.notif;
            const match = isiNotif.match(/Rp\s?([\d\.]+)/);
            
            if (match) {
                const nominalMasuk = parseInt(match[1].replace(/\./g, ''));
                
                db.ref('pending_topup').orderByChild('nominal_harus_transfer').equalTo(nominalMasuk).once('value', (snap) => {
                    if (snap.exists()) {
                        snap.forEach((userSnap) => {
                            const phone = userSnap.key;
                            
                            db.ref('users/' + phone + '/saldo').transaction((currentSaldo) => {
                                return (currentSaldo || 0) + nominalMasuk;
                            }, (error, committed) => {
                                if (committed) {
                                    db.ref('pending_topup/' + phone).remove();
                                    console.log("Saldo berhasil diupdate untuk: " + phone);
                                }
                            });
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
