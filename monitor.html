<!DOCTYPE html>
<html>
<body>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Memantau log baru
  db.ref('logs').limitToLast(1).on('child_added', (snapshot) => {
    const isiNotif = snapshot.val().notif;
    
    // Parsing Nominal (Contoh: "sebesar Rp 211")
    const match = isiNotif.match(/Rp\s?([\d\.]+)/);
    if (match) {
      const nominal = parseInt(match[1].replace(/\./g, ''));
      const targetUser = "085908590859"; // Logika filter ID user di sini

      // Update Saldo via Transaction
      db.ref('users/' + targetUser + '/saldo').transaction((currentSaldo) => {
        return (currentSaldo || 0) + nominal;
      });
    }
  });
</script>
</body>
</html>
