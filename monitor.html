<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <h3>Sistem Monitoring v2</h3>
    <p id="status">Memantau...</p>

<script>
    const firebaseConfig = {
        databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Memantau perubahan pada node transaksi
    db.ref('transaksi').on('child_changed', async (snapshot) => {
        if (snapshot.key === "nominal_terbaru") {
            const nominalMasuk = snapshot.val();
            document.getElementById('status').innerText = "Terdeteksi: " + nominalMasuk;

            const pendingRef = db.ref('pending_topup/' + nominalMasuk);
            const snap = await pendingRef.once('value');

            if (snap.exists()) {
                const data = snap.val();
                
                // Tambahkan saldo
                db.ref('users/' + data.user_id + '/saldo').transaction((current) => {
                    return (parseInt(current || 0) + parseInt(data.nominal_asli));
                });

                // Hapus data agar tidak double
                pendingRef.remove();
                document.getElementById('status').innerText = "Sukses! Saldo " + data.user_id + " bertambah.";
            }
        }
    });
</script>
</body>
</html>
