    .balance-container {

    }
    .balance-label { font-size: 2.58rem; color: #64748b; font-weight: 500; }
    .balance-value { font-size: 3.13rem; font-weight: 700; color: #1e293b; font-family: sans-serif; }

    .menu-btn { width: 45px; height: 45px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
    .menu-btn span { display: block; width: 25px; height: 3px; background: #334155; border-radius: 3px; }
    
    #nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; display: none; }
    #nav-menu { position: fixed; top: 0; left: -480px; width: 480px; height: 100%; background: #ffffff; z-index: 10000; transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 120px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 23px; }

    .nav-item { padding: 20px; background: #f8fafc; font-size: 1.2rem; text-align: center; cursor: pointer; border-radius: 12px; color: #334155; font-weight: 600; transition: 0.3s; text-transform: uppercase; }
    .nav-item:hover { background: #e2e8f0; }

    .container { width: 500px; height: 300px; perspective: 1000px; perspective-origin: 50% -25%; margin: 50px auto; margin-bottom: 20px; }
    .carousel { transform-style: preserve-3d; transform: translateZ(-600px); position: relative; width: 500px; height: 300px; transition: 1s; }
    .carousel img { position: absolute; border: 15px solid #222; opacity: .5; transition: 1s; width: 500px; height: 300px; background:#ccc; cursor: pointer; }
    
    .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(2) { transform: rotateY(45deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(3) { transform: rotateY(90deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(4) { transform: rotateY(135deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(5) { transform: rotateY(180deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(6) { transform: rotateY(225deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(7) { transform: rotateY(270deg) translateZ(600px) scale(.8); }
    .carousel img:nth-child(8) { transform: rotateY(315deg) translateZ(600px) scale(.8); }
    
    .controls-wrapper { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 900px; align-items: center; padding: 0 10px; box-sizing: border-box; }
    .control-row { display: flex; justify-content: center; width: 100%; gap: 20px; flex-wrap: nowrap; margin-bottom: 20px; }
    
    .card-kategori { cursor: pointer; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; width: 26.4%; min-width: 96px; height: 201.6px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: 0.3s; }
    .card-kategori img { width: 84px; height: 84px; margin-bottom: 13.2px; }
    .card-kategori span { font-weight: 600; font-size: 16.8px; color: #333; text-transform: uppercase; text-align: center; }
    .card-kategori:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    
    #input-nomor-tujuan { width: 100%; max-width: 860px; padding: 25px; font-size: 40px; border: 2px solid #e2e8f0; border-radius: 16px; margin: 15px 0; text-align: center; box-sizing: border-box; }
    #info-pelanggan { font-size: 28px; font-weight: bold; margin-bottom: 10px; color: #334155; }
    input[type="radio"] { position: absolute; left: -9999px; }
    
    #item1:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(0deg); }
    #item2:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-45deg); }
    #item3:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-90deg); }
    #item4:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-135deg); }
    #item5:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-180deg); }
    #item6:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-225deg); }
    #item7:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-270deg); }
    #item8:checked ~ .container .carousel { transform: translateZ(-600px) rotateY(-315deg); }
    
    #item1:checked ~ .container .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(600px) scale(1); opacity: 1; }
    #item2:checked ~ .container .carousel img:nth-child(2) { transform: rotateY(45deg) translateZ(600px) scale(1); opacity: 1; }
    #item3:checked ~ .container .carousel img:nth-child(3) { transform: rotateY(90deg) translateZ(600px) scale(1); opacity: 1; }
    #item4:checked ~ .container .carousel img:nth-child(4) { transform: rotateY(135deg) translateZ(600px) scale(1); opacity: 1; }
    #item5:checked ~ .container .carousel img:nth-child(5) { transform: rotateY(180deg) translateZ(600px) scale(1); opacity: 1; }
    #item6:checked ~ .container .carousel img:nth-child(6) { transform: rotateY(225deg) translateZ(600px) scale(1); opacity: 1; }
    #item7:checked ~ .container .carousel img:nth-child(7) { transform: rotateY(270deg) translateZ(600px) scale(1); opacity: 1; }
    #item8:checked ~ .container .carousel img:nth-child(8) { transform: rotateY(315deg) translateZ(600px) scale(1); opacity: 1; }

    #sub-produk-list, #ewallet-sub-list, #smm-sub-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 900px; margin-top: 20px; }
    .sub-item { padding: 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: center; transition: 0.3s; font-size: 43.2px; }
    .sub-item small { font-size: 27.2px; color: #64748b; }

    .sub-item.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .sub-item.disabled { background: #eee !important; cursor: not-allowed !important; opacity: 0.5 !important; pointer-events: none !important; }
    
    #footer-action { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; padding: 20px; display: none; flex-direction: column; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); z-index: 900; }
    #btn-beli-statis { padding: 25px 60px; font-size: 35px; background: #3b82f6; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
    #btn-beli-statis:disabled { background: #ccc; cursor: not-allowed; }
    #status-transaksi { font-size: 24px; font-weight: bold; margin-top: 10px; color: #334155; text-align: center; }
    
    #login-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #fff; z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .login-card { width: 100%; max-width: 500px; text-align: center; }
    .login-card h2 { font-size: 40px; margin-bottom: 30px; }
    .login-card input { width: 100%; padding: 25px; margin: 15px 0; font-size: 30px; border: 2px solid #ccc; border-radius: 12px; box-sizing: border-box; text-align: center; }
    .login-card button { width: 100%; padding: 25px; font-size: 30px; background: #007bff; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    #custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .alert-box { background: #fff; border-radius: 20px; padding: 50px; width: 100%; max-width: 680px; text-align: center; }
    .alert-msg { font-size: 32px; font-weight: bold; margin-bottom: 40px; }
    .alert-btn { padding: 20px 60px; font-size: 28px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
</style>
</head>

        const info = document.getElementById('info-pelanggan');
        
        container.innerHTML = '';
        const catKey = kategoriAktif.toUpperCase();

        let items = [];
        isNomorValid = false;

        if (catKey === "EWALLET") {
            if (!subKategoriAktif) {
                ewalletContainer.innerHTML = '';
                Object.keys(dataProduk["EWALLET"]).forEach(sub => {
                    const btn = document.createElement('div');

                    btn.innerText = sub;

                isNomorValid = (target.length >= 10);
            }
        } else if (catKey === "SMM") {
            if (!subKategoriAktif) {
                smmContainer.innerHTML = '';
                Object.keys(dataProduk["SMM"]).forEach(sub => {
                    const btn = document.createElement('div');
                    btn.className = 'sub-item';
                    btn.innerText = sub;
                    btn.onclick = () => { subKategoriAktif = sub; renderSubProduk(); };
                    smmContainer.appendChild(btn);
                });
                return;
            } else {
                smmContainer.innerHTML = '';
                items = dataProduk["SMM"][subKategoriAktif];
                isNomorValid = (target.length > 5);
            }
        } else if (catKey === "TOKEN LISTRIK") {
            if (target.length >= 10 && !target.startsWith('0')) {
                if(target.length === 10) cekNamaPelanggan(target);
            }
            items = dataProduk["TOKEN LISTRIK"]["PLN"];
            isNomorValid = (target.length >= 10);
        } else {
            if (target.length >= 10 && target.length <= 13) {
                let operator = "";
                if (/^(0811|0812|0813|0821|0822|0823|0851|0852|0853)/.test(target)) operator = "TELKOMSEL";
                else if (/^(0814|0815|0816|0855|0856|0857|0858)/.test(target)) operator = "INDOSAT";
                else if (/^(0817|0818|0819|0877|0878)/.test(target)) operator = "XL";
                else if (/^(0831|0832|0833|0838|0859)/.test(target)) operator = "AXIS";
                else if (/^(0895|0896|0897|0898|0899)/.test(target)) operator = "TRI";
                else if (/^(0881|0882|0883|0884|0885|0886|0887|0888|0889)/.test(target)) operator = "SMARTFREN";

                if (operator && dataProduk[catKey][operator]) {
                    items = dataProduk[catKey][operator];
                    isNomorValid = true;
                }
            }
        }
        
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'sub-item' + (!isNomorValid ? ' disabled' : '');
            
            let hargaTampil = item.harga;
            if (catKey === "SMM") {
                hargaTampil = Math.ceil((item.harga * item.qty) / 1000);
            }

            div.innerHTML = `${item.nama}<br><small>Harga: ${hargaTampil.toLocaleString('id-ID')} | Qty: ${item.qty || '-'}</small>`;
            div.onclick = function() {
                if (!isNomorValid) return;
                document.querySelectorAll('.sub-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                selectedProduct = { ...item, finalHarga: hargaTampil };
                document.getElementById('footer-action').style.display = 'flex';
            };
            container.appendChild(div);
        });
    }

    function cekNamaPelanggan(nomor) {
        const info = document.getElementById('info-pelanggan');
        info.innerText = "Mengecek...";
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ aksi: "cek_pln", tujuan: nomor })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data && data.data.name) {
                info.innerText = "Nama: " + data.data.name;
                isNomorValid = true;
            } else {
                info.innerText = "ID Pelanggan tidak ditemukan";
                isNomorValid = false;
            }
        });
    }

    function cekLoginDanBeli() {
        if (!isNomorValid) { showCustomAlert("Target tidak valid!"); return; }
        if (!selectedProduct) return;
        
        if (!localStorage.getItem('userPhone')) {
            document.getElementById('login-overlay').style.display = 'flex';
        } else {
            if (userSaldo < selectedProduct.finalHarga) { 
                showCustomAlert("Saldo tidak cukup!"); 
            } else {
                eksekusiBeli();
            }
        }
    }

    function prosesLogin() {
        const p = document.getElementById('l-phone').value;
        const pin = document.getElementById('l-pin').value;
        if(p.length < 9 || pin.length < 4) { showCustomAlert("Nomor/PIN tidak valid!"); return; }
        const userRef = db.ref('users/' + p);
        userRef.once('value').then(snap => {
            if (snap.exists()) {
                if (snap.val().pin == pin) {
                    localStorage.setItem('userPhone', p);
                    location.reload();
                } else { showCustomAlert("PIN salah!"); }
            } else {
                const counterRef = db.ref('metadata/last_id');
                counterRef.transaction(currentId => (currentId || 0) + 1, (error, committed, snapshot) => {
                    if (committed) {
                        const newId = String(snapshot.val()).padStart(3, '0');
                        userRef.set({ phone: p, pin: pin, saldo: 0, id_unik: newId }).then(() => {
                            localStorage.setItem('userPhone', p);
                            location.reload();
                        });
                    }
                });
            }
        });
    }

    function eksekusiBeli() {
        const target = document.getElementById('input-nomor-tujuan').value;
        const idTransaksi = (kategoriAktif === 'SMM' ? "SMM" : "TRX") + new Date().getTime();
        const uid = localStorage.getItem('userPhone') || "guest";
        
        const payload = (kategoriAktif === 'SMM') ? {
            aksi: "bayar_smm",
            tujuan: target,
            quantity: selectedProduct.qty,
            service_id: selectedProduct.kode,
            id_firebase: idTransaksi,
            uid: uid,
            harga: selectedProduct.finalHarga
        } : {
            aksi: "bayar", 
            tujuan: target, 
            produk: selectedProduct.kode,
            kuantitas: selectedProduct.qty || 0,
            id_firebase: idTransaksi, 
            uid: uid,
            harga: selectedProduct.finalHarga
        };
        
        fetch(WEB_APP_URL, { 
          method: 'POST', 
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message || "Pesanan sedang diproses.");
            location.reload();
        })
        .catch(err => alert("Gagal koneksi ke server"));
    }
</script>
