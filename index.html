<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Index</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://nasuka.pro/naspro2.css">
</head>
<body>
<header>
    <div class="menu-container">
        <div class="titik-tiga" onclick="toggleDropdown()">&#8942;</div>
        <div id="dropdownMenu" class="dropdown-menu">
            
            <div onclick="window.AppInventor.setWebViewString('buka_profil')">Akun</div>           
            <div             onclick="window.AppInventor.setWebViewString('buka_riwayat')">Riwayat</div>               
            <div onclick="window.AppInventor.setWebViewString('buka_pengaturan')">Pengaturan</div>      
                    
        </div>        
    </div>
    
    <div class="balance-container" style="display: none;">
        <span class="balance-label"></span>
        <span id="display-saldo" class="balance-value">Rp --</span>
    </div>
</header>

<input checked id="item1" name="multiples" type="radio">
<input id="item2" name="multiples" type="radio">
<input id="item3" name="multiples" type="radio">
<input id="item4" name="multiples" type="radio">
<input id="item5" name="multiples" type="radio">
<input id="item6" name="multiples" type="radio">
<input id="item7" name="multiples" type="radio">
<input id="item8" name="multiples" type="radio">

<div class="container">     <div class="carousel">
<img src="https://nasuka.pro/gambar/pulsa.jpg" onclick="pilihKategori('Pulsa')">
<img src="https:nasuka.pro/gambar/data.jpg" onclick="pilihKategori('Paket Data')">
<img src="https://nasuka.pro/gambar/masaaktif.jpg" onclick="pilihKategori('Masa Aktif')">
<img src="https://nasuka.pro/gambar/ewallet.jpg" onclick="pilihKategori('Ewallet')">
<img src="https://nasuka.pro/gambar/smm.jpg" onclick="pilihKategori('SMM')">
<img src="https://nasuka.pro/gambar/tokenlistrik.jpg" onclick="pilihKategori('Token Listrik')">
        <img src="">
        <img src="">
    </div>
</div>

<div id="input-top-container" class="card">
    <input type="text" id="input-nomor-tujuan" placeholder="Target Nomor Tujuan / Url">
</div>

<div id="input-pln-container" class="card">
    <input type="text" id="meter_id" placeholder="ID Pelanggan" inputmode="numeric">
</div>

<div class="controls-wrapper">
    <div class="control-row">
        <label class="card-kategori" for="item1" onclick="pilihKategori('Pulsa')"><span>Pulsa</span></label>
        <label class="card-kategori" for="item2" onclick="pilihKategori('Paket Data')"><span>Data</span></label>
        <label class="card-kategori" for="item3" onclick="pilihKategori('Masa Aktif')"><span>Masa </span></label>
        <label class="card-kategori" for="item6" onclick="pilihKategori('Token Listrik')"><span>PLN</span></label>
    </div>
    <div class="control-row">
        <label class="card-kategori" for="item5" onclick="pilihKategori('SMM')"><span>SMM</span></label>
        <label class="card-kategori" for="item4" onclick="pilihKategori('Ewallet')"><span>Ewallet</span></label>
        <label class="card-kategori disabled" for="item7"><span>Segera</span></label>
        <label class="card-kategori disabled" for="item8"><span>Event</span></label>
    </div>
</div>

<div class="panel-container">
    
    <div id="panel-smm" class="card" style="display:none;">
  
    <div style="display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px;">
        <button onclick="pilihSubSMM('Tiktok')">Tiktok</button>
        <button onclick="pilihSubSMM('Youtube')">Youtube</button>
        <button onclick="pilihSubSMM('Instagram')">Instagram</button>
        <button onclick="pilihSubSMM('Facebook')">Facebook</button>
    </div>

    <div id="gridSMM" class="product-grid"></div>
    <div id="result" class="api-response"></div>
</div>     

    <div id="panel-pln" class="card" style="display:none;">
        <button type="button" id="btnCheck">Cek Pelanggan</button>
        <div id="resultPLN" class="api-response"></div>
        <input type="text" id="order_meter_id" placeholder="ID Terverifikasi" readonly style="display:none;">
        <div id="gridPLN" class="product-grid">
     
     
            <div class="product-item" onclick="pilihProdukGlow(this, 'DDPLN5', 7000, 0, '')">
                <div class="product-name">PLN 5.000</div>
                <div class="product-price">Rp 7.000</div>
            </div>
            <div class="product-item" onclick="pilihProdukGlow(this, 'PLN10', 12000, 0, '')">
                <div class="product-name">PLN 10.000</div>
                <div class="product-price">Rp 12.000</div>
            </div>
            <div class="product-item" onclick="pilihProdukGlow(this, 'PLN15', 17000, 0, '')">
                <div class="product-name">PLN 15.000</div>
                <div class="product-price">Rp 17.000</div>
            </div>
            <div class="product-item" onclick="pilihProdukGlow(this, 'PLN20', 22000, 0, '')">
                <div class="product-name">PLN 20.000</div>
                <div class="product-price">Rp 22.000</div>
            </div>
            
         <div class="product-item" onclick="pilihProdukGlow(this, 'PLN50', 52000, 0, '')">
                <div class="product-name">PLN 25.000</div>
                <div class="product-price">Rp 27.000</div>
            </div>          
            
            
            <div class="product-item" onclick="pilihProdukGlow(this, 'PLN50', 52000, 0, '')">
                <div class="product-name">PLN 50.000</div>
                <div class="product-price">Rp 52.000</div>
            </div>     
            
         <div class="product-item" onclick="pilihProdukGlow(this, 'PLN50', 52000, 0, '')">
                <div class="product-name">PLN 100.000</div>
                <div class="product-price">Rp 102.000</div>
            </div>     
            
           <div class="product-item" onclick="pilihProdukGlow(this, 'PLN50', 52000, 0, '')">
                <div class="product-name">PLN 500.000</div>
                <div class="product-price">Rp 502.000</div>
            </div>        
            
       <div class="product-item" onclick="pilihProdukGlow(this, 'PLN50', 52000, 0, '')">
                <div class="product-name">PLN 1.000.000</div>
                <div class="product-price">Rp 1.000.000</div>
            </div>                        
        </div>
    </div>
    
    <div id="panel-pulsa" class="card" style="display:none;">
    <div id="gridPulsa" class="product-grid"></div>
    <div id="resultPulsa" class="api-response"></div>
</div>  
            
    <div id="panel-paket" class="card" style="display:none;">
    <div id="gridPaket" class="product-grid"></div>
    <div id="resultPaket" class="api-response"></div>
</div>
       
    <div id="panel-aktif" class="card" style="display:none;">
    <div id="gridAktif" class="product-grid"></div>
    <div id="resultAktif" class="api-response"></div>
</div>    

    <div id="panel-ewallet" class="card" style="display:none;">
   
    <div style="display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto;">
        <button onclick="pilihSubEwallet('DANA')">DANA</button>
        <button onclick="pilihSubEwallet('GOPAY')">GOPAY</button>
        <button onclick="pilihSubEwallet('OVO')">OVO</button>
        <button onclick="pilihSubEwallet('SHOPEEPAY')">SHOPEEPAY</button>
    </div>
   
    <div id="gridEwallet" class="product-grid"></div>
    <div id="resultEwallet" class="api-response"></div>
</div>
   
<div id="footer-order">
    <button id="btn-beli-dinamis" onclick="eksekusiBeli()">Beli Sekarang</button>
</div>

<div style="text-align:center; margin-bottom: 25px;">
    <strong id="display-user"></strong>
    <button id="logout-btn" onclick="logout()">Logout</button>
</div>

<div id="customAlert" class="modal-overlay">
    <div class="modal-content">
        <div id="alertMessage" style="margin-bottom:15px;"></div>
        <button class="modal-close-btn" onclick="tutupCustomAlert()">OK</button>
    </div>
</div>

<div id="apiModal" class="modal-overlay">
    <div class="modal-content" id="modalContent">
        <div id="modalBody"></div>
        <button class="modal-close-btn" onclick="tutupModal()">Tutup</button>
    </div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      
        <input type="text" id="loginPhone" class="login-input" placeholder="Nomor Handphone" inputmode="numeric" pattern="[0-9]*" maxlength="13">
        <input type="password" id="loginPin" class="login-input" placeholder="PIN (4 Digit)" inputmode="numeric" pattern="[0-9]*" maxlength="4">
        <button id="btnLoginAction" class="login-btn" onclick="prosesLogin()">Masuk</button>
        <button type="button" class="login-close" onclick="hideLogin()">Batal</button>
    </div>
</div>

<script src="https://nasuka.pro/naspro1.js"></script>
</body>
</html>
