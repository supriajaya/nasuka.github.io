<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Realtime Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    body, html { height: 100%; margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDXo3x2WA13dElu0jiRcDjzbm-2499Zaro",
    authDomain: "nasukawireless-5808a.firebaseapp.com",
    databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nasukawireless-5808a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const map = L.map('map').setView([-6.9740, 107.5900], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker = L.marker([0, 0]).addTo(map);

navigator.geolocation.watchPosition((position) => {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    
    marker.setLatLng([lat, lng]);
    map.panTo([lat, lng]);
    
    db.ref('lokasi_admin').set({ lat: lat, lng: lng });
}, (err) => {
    alert("Izin lokasi ditolak atau GPS mati. Buka pengaturan browser, cari 'Site Settings' > 'Location', dan izinkan situs ini.");
}, { 
    enableHighAccuracy: true, 
    timeout: 5000, 
    maximumAge: 0 
});
</script>
</body>
</html>
