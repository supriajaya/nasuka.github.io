<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Location</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    button { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-izinkan { background: #28a745; color: white; }
    .btn-tolak { background: #dc3545; color: white; }
</style>
</head>
<body>

<div class="card">
    <h3>Data Lokasi Admin (Realtime)</h3>
    <div id="loc-data" style="font-size: 1.2em; font-weight: bold; color: #007bff;">Memuat...</div>
</div>

<div class="card">
    <h3>Kelola Akses User</h3>
    <div id="user-list">Memuat daftar user...</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDXo3x2WA13dElu0jiRcDjzbm-2499Zaro",
    authDomain: "nasukawireless-5808a.firebaseapp.com",
    databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nasukawireless-5808a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('lokasi_admin').on('value', snap => {
    const loc = snap.val();
    if (loc) {
        document.getElementById('loc-data').innerHTML = `Lat: ${loc.lat}<br>Lng: ${loc.lng}`;
    } else {
        document.getElementById('loc-data').innerHTML = "Menunggu data koordinat...";
    }
});

db.ref('users').on('value', snap => {
    const list = document.getElementById('user-list');
    list.innerHTML = "";
    snap.forEach(child => {
        const user = child.val();
        const phone = child.key;
        const isAuth = user.is_authorized === true;
        
        list.innerHTML += `
            <div class="user-item">
                <span>${phone} (${isAuth ? "Aktif" : "Tidak Aktif"})</span>
                <button class="${isAuth ? 'btn-tolak' : 'btn-izinkan'}" onclick="updateAkses('${phone}', ${!isAuth})">${isAuth ? 'Tolak' : 'Izinkan'}</button>
            </div>
        `;
    });
});

function updateAkses(phone, status) {
    db.ref('users/' + phone).update({ is_authorized: status });
}
</script>
</body>
</html>
