<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riwayat Transaksi</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    :root {
        --glass: rgba(255, 255, 255, 0.15);
        --accent: #6366f1;
    }
    body { 
        margin: 0; 
        padding: 20px 10px; 
        font-family: 'Inter', sans-serif; 
        background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        background-attachment: fixed;
        min-height: 100vh;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
    } 
    .panel-container { width: 100%; max-width: 450px; }
    .card { 
        background: var(--glass); 
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px; 
        padding: 20px; 
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { 
        padding: 8px 16px; border: none; border-radius: 20px; 
        background: rgba(0,0,0,0.2); color: #cbd5e1; 
        cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.3s;
    }
    .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
    h2 { font-size: 1.2rem; margin: 0 0 15px 0; letter-spacing: -0.5px; }
    .history-item { 
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid transparent;
        transition: 0.3s;
    }
    .history-item:hover { background: rgba(255,255,255,0.1); border-left-color: var(--accent); }
    .history-info strong { display: block; font-size: 0.9rem; }
    .history-info small { color: #94a3b8; font-size: 0.75rem; }
    .status-badge { font-size: 0.65rem; padding: 4px 8px; border-radius: 20px; font-weight: bold; }
    .success { background: #059669; color: white; }
    .ordered { background: #d97706; color: white; }
    .failed { background: #dc2626; color: white; }
    dialog { border: none; border-radius: 20px; padding: 0; width: 90%; background: #1e293b; color: white; }
    .struk { padding: 25px; text-align: center; }
    .sn-box { background: #0f172a; padding: 12px; margin: 15px 0; border-radius: 8px; font-family: monospace; }
    .btn-close { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="panel-container">
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('reguler')">Reguler</button>
            <button class="tab-btn" onclick="switchTab('ewallet')">E-Wallet</button>
            <button class="tab-btn" onclick="switchTab('pln')">PLN</button>
        </div>
        <h2 id="panelTitle">Riwayat Reguler</h2>
        <div id="historyList"></div>
    </div>
</div>

<dialog id="strukModal">
    <div class="struk" id="modalContent"></div>
    <button class="btn-close" onclick="document.getElementById('strukModal').close()">TUTUP</button>
</dialog>

<script>
    const FIREBASE_URL = "https://endata-nasuka-wireless-default-rtdb.asia-southeast1.firebasedatabase.app/";
    firebase.initializeApp({ databaseURL: FIREBASE_URL });
    
    const productMapping = {
        "40008": { name: "Tiktok Views 500", cat: "smm" },
        "40009": { name: "Tiktok 500 Views", cat: "smm" },
        "D1": { name: "DANA • Rp 1.000", cat: "ewallet" },
        "ADW1": { name: "Paket Warnet 1 Jam", cat: "reguler" },
        "PLN20": { name: "TOKEN PLN 20rb", cat: "pln" }
    };

    let currentCategory = 'reguler';

    function getStatusText(status) {
        const mapping = { 'success': 'Berhasil', 'ordered': 'Diproses', 'failed': 'Gagal' };
        return mapping[status] || status;
    }

    function switchTab(cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === cat) btn.classList.add('active');
        });
        document.getElementById('panelTitle').innerText = 'Riwayat ' + cat.charAt(0).toUpperCase() + cat.slice(1);
        loadHistory();
    }

    function showDetail(item, key) {
        const modal = document.getElementById('strukModal');
        const content = document.getElementById('modalContent');
        const prodData = productMapping[String(item.product)];
        const displayName = prodData ? prodData.name : item.product;
        
        content.innerHTML = `
            <h3 style="margin-top:0;">DETAIL TRANSAKSI</h3>
            <div class="struk-info" style="text-align:left; font-size: 0.85rem;">
                <div style="margin-bottom:5px;">Waktu: ${new Date(item.timestamp).toLocaleString('id-ID')}</div>
                <div style="margin-bottom:5px;">ID: ${key}</div>
                <div style="margin-bottom:5px;">Produk: ${displayName}</div>
                <div style="margin-bottom:5px;">Tujuan: ${item.dest}</div>
                <div style="margin-bottom:5px;">Status: ${getStatusText(item.status)}</div>
                <div style="font-size: 1.1rem; font-weight: bold; margin-top:15px;">Total: Rp ${item.price ? item.price.toLocaleString('id-ID') : '0'}</div>
            </div>
            ${item.sn ? `<div class="sn-box">${item.type === 'pln' ? 'TOKEN PLN:' : 'SN:'}<br>${item.sn}</div>` : ''}
        `;
        modal.showModal();
    }

    async function loadHistory() {
        const ph = localStorage.getItem('userPhone');
        const container = document.getElementById('historyList');
        if (!ph) return;
        
        container.innerHTML = 'Memuat...';
        
        const res = await fetch(`${FIREBASE_URL}users/${ph}/riwayat.json`);
        const data = await res.json();
        
        container.innerHTML = '';
        if (!data) { container.innerHTML = 'Belum ada riwayat.'; return; }
        
        let items = Object.keys(data).map(key => ({ key, ...data[key] }));
        
        items = items.filter(item => {
            const prodData = productMapping[String(item.product)];
            const itemCat = prodData ? prodData.cat : (item.type || 'reguler');
            return itemCat === currentCategory;
        });

        items.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        if (items.length === 0) { container.innerHTML = 'Belum ada riwayat.'; return; }
        
        items.forEach(item => {
            const prodData = productMapping[String(item.product)];
            const displayName = prodData ? prodData.name : item.product;
            const div = document.createElement('div');
            div.className = 'history-item';
            div.onclick = () => showDetail(item, item.key);
            div.innerHTML = `
                <div class="history-info">
                    <strong>${displayName}</strong>
                    <small>${item.dest} • Rp ${item.price ? item.price.toLocaleString('id-ID') : '0'}</small>
                </div>
                <span class="status-badge ${item.status}">${getStatusText(item.status)}</span>
            `;
            container.appendChild(div);
        });
    }

    loadHistory();
</script>
</body>
</html>
