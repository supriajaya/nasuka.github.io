<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Profil</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    body { 
        margin: 0; 
        padding: 11.7px 11.7px 117px 11.7px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        font-family: 'Inter', -apple-system, sans-serif; 
        background-image: url('https://nasuka.pro/gambar/gal.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        min-height: 100vh;
        box-sizing: border-box;
        font-size: 104%; 
        font-weight: bold; 
    }
    
    .panel-container { width: 100%; max-width: 1710px; margin: 98.8px auto; }
   
    .profile-info { margin: 74.1px 0; text-align: left; padding: 49.4px; border-radius: 29.64px; border: 1px solid black; }
    .profile-row { display: flex; justify-content: space-between; padding: 29.64px 0; border-bottom: 1px solid black; font-size: 44.46px; }
    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: black; font-weight: 600; }
    .profile-value { color: black; font-weight: 700; }
</style>
</head>
<body>

<div class="panel-container">
    <div class="card">
        <div class="profile-info">
            <div class="profile-row">
                <span class="profile-label">Nomor HP</span>
                <span id="profile-phone" class="profile-value">-</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Saldo Akun</span>
                <span id="profile-saldo" class="profile-value">Rp -</span>
            </div>
        </div>
    </div>



    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://endata-nasuka-wireless-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    window.onload = function() {
        const ph = localStorage.getItem('userPhone');
        if (ph) {
            document.getElementById('profile-phone').innerText = ph;
            db.ref('users/' + ph + '/saldo').on('value', snap => {
                const userSaldo = snap.val() || 0;
                const formattedSaldo = "Rp " + userSaldo.toLocaleString('id-ID');
                document.getElementById('profile-saldo').innerText = formattedSaldo;
            });
        }
    };
</script>

</body>
</html>
