<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    body { margin: 0; padding: 0; font-family: sans-serif; background: url('https://nasuka.pro/gambar/ombak2.gif') no-repeat center center fixed; background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .login-container { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); display: flex; flex-direction: column; }
    .header-text { color: #fff; text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .input-group { position: relative; margin-bottom: 20px; }
    .auth-input { width: 100%; padding: 15px 15px 15px 45px; border: none; border-radius: 15px; font-size: 16px; box-sizing: border-box; background: rgba(255, 255, 255, 0.8); }
    .icon { position: absolute; left: 15px; top: 15px; font-size: 18px; }
    #btn-login { width: 100%; padding: 15px; background: rgba(211, 211, 211, 0.7); color: #fff; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #btn-login.active { background: #007bff; cursor: pointer; color: white; }
    .footer-action { text-align: center; margin-top: 20px; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .footer-action span { color: #ffeb3b; font-weight: bold; cursor: pointer; text-decoration: underline; }
    #custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .alert-box { background: rgba(255,255,255,0.9); padding: 25px; border-radius: 20px; text-align: center; width: 80%; max-width: 280px; }
</style>
</head>
<body>

<div class="login-container">
    <div class="header-text">Nasuka Wireless</div>
    
    <div class="input-group">
        <span class="icon">👤</span>
        <input type="number" inputmode="numeric" id="in-phone" class="auth-input" placeholder="Nomor HP" oninput="if(this.value.length>13)this.value=this.value.slice(0,13); checkInput()">
    </div>
    
    <div class="input-group">
        <span class="icon">🔒</span>
        <input type="number" inputmode="numeric" id="in-pin" class="auth-input" placeholder="PIN (4 digit)" oninput="if(this.value.length>4)this.value=this.value.slice(0,4); checkInput()">
    </div>
    
    <button id="btn-login" onclick="authApp()">Masuk</button>
    
    <div class="footer-action">
        Batal login? <span onclick="window.history.back()">Klik di sini</span>
    </div>
</div>

<div id="custom-alert-overlay">
    <div class="alert-box">
        <div id="msg-alert" style="font-weight: bold; font-size: 18px; margin-bottom: 20px;">Login Berhasil</div>
        <button onclick="window.location.href='https://nasuka.pro/event.html'" style="width:100%; padding:12px; background:#007bff; color:#fff; border:none; border-radius:10px; font-weight:bold;">OK</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDXo3x2WA13dElu0jiRcDjzbm-2499Zaro",
    authDomain: "nasukawireless-5808a.firebaseapp.com",
    databaseURL: "https://nasukawireless-5808a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nasukawireless-5808a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function checkInput() {
    const phone = document.getElementById('in-phone').value;
    const pin = document.getElementById('in-pin').value;
    const btn = document.getElementById('btn-login');
    if(phone.length >= 10 && pin.length === 4) {
        btn.classList.add('active');
    } else {
        btn.classList.remove('active');
    }
}

function authApp() {
    const phone = document.getElementById('in-phone').value;
    const pin = document.getElementById('in-pin').value;
    if(phone.length < 10 || pin.length < 4) return;
    
    db.ref('users/' + phone).once('value', snap => {
        if(snap.exists()){
            if(snap.val().pin == pin){
                localStorage.setItem('user_data', JSON.stringify(snap.val()));
                document.getElementById('msg-alert').innerText = "Login Berhasil";
                document.getElementById('custom-alert-overlay').style.display = 'flex';
            } else {
                alert("PIN Salah");
            }
        } else {
            const newUser = { phone: phone, pin: pin, saldo: 0 };
            db.ref('users/' + phone).set(newUser);
            localStorage.setItem('user_data', JSON.stringify(newUser));
            document.getElementById('msg-alert').innerText = "Akun Baru Dibuat";
            document.getElementById('custom-alert-overlay').style.display = 'flex';
        }
    });
}
</script>
</body>
</html>
